name: Build Containers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: [vulkan-radv, vulkan-amdvlk, rocm, cuda, cpu]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Log out of all registries to ensure clean state for anonymous pulls
      - name: Log out of all registries
        run: |
          docker logout ghcr.io 2>/dev/null || true
          docker logout docker.io 2>/dev/null || true
          # Clear any cached credentials
          rm -f ~/.docker/config.json
          mkdir -p ~/.docker

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: toolboxes/Dockerfile.${{ matrix.tag }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.tag }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.tag }}:${{ github.sha }}
          build-args: |
            REPO=https://github.com/ggerganov/llama.cpp.git
            BRANCH=master
          provenance: false