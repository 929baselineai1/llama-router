name: Build Containers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: [vulkan-radv, vulkan-amdvlk, rocm, cuda, cpu]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Wipe all Docker credentials
        run: |
          rm -rf ~/.docker
          mkdir -p ~/.docker
          echo '{}' > ~/.docker/config.json

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: toolboxes/Dockerfile.${{ matrix.tag }}
          platforms: linux/amd64
          push: false
          tags: test
          build-args: |
            REPO=https://github.com/ggerganov/llama.cpp.git
            BRANCH=master
          provenance: false