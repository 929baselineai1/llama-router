name: Build Containers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: [vulkan-radv, vulkan-amdvlk, rocm, cuda, cpu]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Docker for anonymous Hub pulls
        run: |
          # Remove any stored Docker Hub credentials so pulls are anonymous
          mkdir -p ~/.docker
          cat > ~/.docker/config.json << 'DOCKERCFG'
          {
            "auths": {},
            "HttpHeaders": {
              "User-Agent": "Docker-Client"
            }
          }
          DOCKERCFG

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: toolboxes/Dockerfile.${{ matrix.tag }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.tag }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.tag }}:${{ github.sha }}
          build-args: |
            REPO=https://github.com/ggerganov/llama.cpp.git
            BRANCH=master
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
          provenance: false