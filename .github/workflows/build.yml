name: Build Containers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: vulkan-radv
            dockerfile: toolboxes/Dockerfile.vulkan-radv
          - tag: vulkan-amdvlk
            dockerfile: toolboxes/Dockerfile.vulkan-amdvlk
          - tag: rocm
            dockerfile: toolboxes/Dockerfile.rocm
          - tag: cuda
            dockerfile: toolboxes/Dockerfile.cuda
          - tag: cpu
            dockerfile: toolboxes/Dockerfile.cpu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.tag }}
          tags: |
            type=sha,prefix=,suffix=,format=sha-{{ sha }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            REPO=https://github.com/ggerganov/llama.cpp.git
            BRANCH=master